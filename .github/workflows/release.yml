name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  version:
    name: Read the version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.tag.outputs.version }}
      prerelease: ${{ steps.tag.outputs.prerelease }}
    steps:
      - id: tag
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v([0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?)$ ]]; then
            echo "::error::Tags look like v1.5.0 or v1.5.0-beta, not $GITHUB_REF_NAME."
            exit 1
          fi
          echo "version=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

  tests:
    needs: version
    uses: ./.github/workflows/tests.yml

  release:
    name: Build and publish
    needs: [version, tests]
    runs-on: xcode-27
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Install XcodeGen
        run: brew install xcodegen

      # "latest" skips pre-releases, so stable users are never offered a beta.
      - name: Build the DMG and the appcast
        env:
          VRAI_VERSION: ${{ needs.version.outputs.version }}
          VRAI_FEED_URL: https://github.com/${{ github.repository }}/releases/latest/download/appcast.xml
          VRAI_DOWNLOAD_URL_PREFIX: https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/
          VRAI_PUBLIC_ED_KEY: GMkjaYeFYrt1wRG9fOTGSD0sVUix2riAaLSH7Rc+DsU=
          VRAI_PRIVATE_ED_KEY: ${{ secrets.VRAI_PRIVATE_ED_KEY }}
        run: Scripts/release.sh --adhoc

      - name: Check every binary runs on Apple silicon and Intel
        run: |
          for binary in build/release/export/Vrai.app/Contents/MacOS/*; do
            archs="$(lipo -archs "$binary")"
            echo "$(basename "$binary"): $archs"
            for arch in arm64 x86_64; do
              [[ " $archs " == *" $arch "* ]] || { echo "::error::$(basename "$binary") has no $arch slice."; exit 1; }
            done
          done

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          flags=(--verify-tag --title "Vrai $VERSION" --generate-notes)
          [[ "$PRERELEASE" == true ]] && flags+=(--prerelease)
          gh release create "$GITHUB_REF_NAME" "build/release/Vrai-$VERSION.dmg" build/release/appcast.xml "${flags[@]}"

      # Later edits on GitHub go through the Release notes workflow.
      - name: Copy the notes into the appcast
        env:
          GH_TOKEN: ${{ github.token }}
        run: Scripts/appcast-notes.sh "$GITHUB_REF_NAME"

  # Stable releases only; the cask should never point at a beta.
  homebrew:
    name: Update the Homebrew cask
    needs: [version, release]
    if: needs.version.outputs.prerelease == 'false'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Point Casks/vrai.rb at the new DMG
        env:
          GH_TOKEN: ${{ github.token }}
          TAP_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
        run: |
          if [[ -z "$TAP_TOKEN" ]]; then
            echo "::error::Add a TAP_GITHUB_TOKEN secret that can push to aaravmaloo/homebrew-tap, then re-run this job."
            exit 1
          fi
          gh release download "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" -p "Vrai-$VERSION.dmg"
          sha="$(sha256sum "Vrai-$VERSION.dmg" | cut -d' ' -f1)"
          git clone --depth 1 "https://x-access-token:$TAP_TOKEN@github.com/aaravmaloo/homebrew-tap.git" tap
          cd tap
          sed -i -E "s/^  version \".*\"$/  version \"$VERSION\"/; s/^  sha256 \".*\"$/  sha256 \"$sha\"/" Casks/vrai.rb
          grep -q "version \"$VERSION\"" Casks/vrai.rb && grep -q "sha256 \"$sha\"" Casks/vrai.rb || { echo "::error::Casks/vrai.rb did not take the new version."; exit 1; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/vrai.rb
          if git diff --cached --quiet; then
            echo "The cask already points at $VERSION."
            exit 0
          fi
          git commit -m "Update vrai to $VERSION"
          git push
